<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Game</title>
    <link rel="stylesheet" href="https://bootstraptema.ru/snippets/style/2015/bootswatch/bootstrap-united-v3.3.6.css" media="screen">
    <link rel="stylesheet" href="https://bootstraptema.ru/snippets/style/2015/bootswatch/custom.min.css">

    <style>
        body {
            background-color: #fdfdfd;
            padding-top: 50px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            color: #b63c2f;
            font-weight: 700;
        }

        #gamesTable {
            background: #fff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        #gamesTable th {
            background-color: #d9534f;
            color: #fff;
            text-align: center;
            font-weight: bold;
        }

        #gamesTable td {
            text-align: center;
            vertical-align: middle;
        }

        #gamesTable td:first-child {
            color: #b63c2f;
            font-weight: 600;
            cursor: pointer;
        }

        #gamesTable td:first-child:hover {
            text-decoration: underline;
        }

        .addgame {
            margin-top: 40px;
            background-color: #fff;
            border: 1px solid #ddd;
            padding: 25px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .addgame h3 {
            color: #b63c2f;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .modal-content {
            border-radius: 6px;
        }

        .modal-header {
            background-color: #d9534f;
            color: #fff;
            border-bottom: none;
        }

        .modal-footer {
            border-top: none;
        }
    </style>
</head>
<body>
<header>
    <h1>Game List</h1>
</header>

<div id="app" class="container">

    <table id="gamesTable" class="table table-striped table-bordered">
        <tr>
            <th>Name</th>
            <th>Price (€)</th>
        </tr>
        <tr v-for="game in games" :key="game.id">
            <td @click="getGame(game.id)">{{ game.name }}</td>
            <td>{{ game.price }}</td>
        </tr>
    </table>

    <div id="gameInfoModal" class="modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Game Info</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped">
                        <tr>
                            <th>Name</th>
                            <td>{{ gameInModal.name }}</td>
                        </tr>
                        <tr>
                            <th>Price (€)</th>
                            <td>{{ gameInModal.price }}</td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/vue@3.2.47/dist/vue.global.js"></script>
<script src="rest-client.js"></script>
</body>
</html>
